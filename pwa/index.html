<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="robots" content="noindex, nofollow, noarchive"/>
<meta name="referrer" content="no-referrer"/>
<meta name="theme-color" content="#1E5B45"/>
<title>MahalleCoop Üye</title>
<link rel="manifest" href="./manifest.webmanifest"/>
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="./icons/icon.svg"/>
<link rel="stylesheet" href="./css/app.css"/>
</head>
<body>
<a class="zipla" href="#icerik">İçeriğe geç</a>

<header class="ust">
  <div class="marka">
    <span class="marka-ad">MahalleCoop</span>
    <span class="etiket" id="mod-etiketi" hidden>Demo</span>
  </div>
  <button class="zil" type="button" data-yon="bildirimler" aria-label="Bildirimler">
    <span aria-hidden="true">🔔</span>
    <span class="zil-sayi" id="zil-sayi" hidden>0</span>
  </button>
</header>

<div class="uyari" id="uyari-seridi" hidden></div>

<main id="icerik" class="icerik" tabindex="-1">
  <noscript>Bu uygulama JavaScript ile çalışır. Tarayıcında JavaScript'i aç.</noscript>
</main>

<nav class="sekmeler" aria-label="Ana bölümler">
  <button type="button" data-yon="katalog"><span aria-hidden="true">🧺</span>Katalog</button>
  <button type="button" data-yon="sepet"><span aria-hidden="true">🛒</span>Sepetim<span class="sek-sayi" id="sepet-sayi" hidden>0</span></button>
  <button type="button" data-yon="siparisler"><span aria-hidden="true">📦</span>Siparişler</button>
  <button type="button" data-yon="profil"><span aria-hidden="true">👤</span>Profil</button>
  <button type="button" data-yon="bildirimler"><span aria-hidden="true">🔔</span>Bildirim</button>
</nav>

<div class="bilgi" id="bilgi" role="status" aria-live="polite" hidden></div>

<script src="./js/cart.js"></script>
<script src="./js/store.js"></script>
<script src="./js/api.js"></script>
<script src="./js/app.js"></script>
<script src="./js/access-gate.js"></script>
</body>
</html>
